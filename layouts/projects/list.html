{{ define "main" }}
  <div class="gallery">
    {{ range .Pages }}
      <div class="gallery-item">
        {{ with .Params.image }}
          <img src="{{ . | relURL }}" alt="{{ $.Params.title }}" height="50" width="50">
        {{ else }}
          <p>No Image Available</p>
        {{ end }}
        {{ with .Params.title }}
          <h3>{{ . }}</h3>
        {{ end }}
        {{ with .Params.headline }}
          <p>{{ . }}</p>
        {{ end }}
        <a href="{{ .RelPermalink }}">View Project</a>
      </div>
    {{ end }}
  </div>
{{ end }}
